[package]
name = "rine-common-user32"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared architecture-neutral user32 logic for rine"

[features]
default = ["backend-native"]
backend-native = ["dep:winit"]
backend-emulated = ["dep:rine-channel"]

[dependencies]
rine-channel = { workspace = true, optional = true }
dbcs = { workspace = true }
text = { workspace = true }
registry-runtime = { workspace = true }
rine-types = { workspace = true }
rine-common-gdi32 = { workspace = true }
winit = { workspace = true, optional = true }
tracing = { workspace = true }
goblin = { workspace = true }
rfd = { workspace = true }
tiny-skia = { workspace = true }
fontdb = { workspace = true }
fontdue = { workspace = true }
x11rb = { version = "0.13", default-features = false }

[dev-dependencies]
serial_test = { workspace = true }